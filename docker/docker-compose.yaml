networks:
  default:
    name: traefik_default
    external: true

services:
  fuck-web:
    image: openresty/openresty:alpine
    container_name: fuck-web
    restart: always
    depends_on:
      - fuck-api
    volumes:
      - ${WEB_DIST_PATH}:/usr/local/openresty/nginx/html:ro
      - ./openresty/conf.d/my.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.${WEB_ROUTER_NAME}.service=${WEB_SERVICE_NAME}
      - traefik.http.routers.${WEB_ROUTER_NAME}.rule=Host(`${WEB_HOST}`)
      - traefik.http.routers.${WEB_ROUTER_NAME}.entrypoints=https
      - traefik.http.routers.${WEB_ROUTER_NAME}.tls.certresolver=myresolver
      - traefik.http.services.${WEB_SERVICE_NAME}.loadbalancer.server.port=${WEB_CONTAINER_PORT}

  fuck-api:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/mcr.microsoft.com/playwright:v1.59.1-jammy
    container_name: fuck-api
    restart: always
    working_dir: /app
    command: ["node", "dist/main.js"]
    volumes:
      - ${API_APP_PATH}:/app
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - NODE_ENV=production
      - TZ=${TZ}
    labels:
      - traefik.enable=true
      - traefik.http.routers.${API_ROUTER_NAME}.service=${API_SERVICE_NAME}
      - traefik.http.routers.${API_ROUTER_NAME}.rule=Host(`${API_HOST}`)
      - traefik.http.routers.${API_ROUTER_NAME}.entrypoints=https
      - traefik.http.routers.${API_ROUTER_NAME}.tls.certresolver=myresolver
      - traefik.http.services.${API_SERVICE_NAME}.loadbalancer.server.port=${API_CONTAINER_PORT}
